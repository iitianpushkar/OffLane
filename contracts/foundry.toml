[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
tempo = true

# Local tests/build don't need an RPC. Pass --rpc-url tempo|moderato (or set
# these env vars) for anything that talks to a live network, e.g.:
#   forge test --rpc-url moderato
#   forge script script/Deploy.s.sol --rpc-url tempo --broadcast
[rpc_endpoints]
tempo = "${TEMPO_RPC_URL}"
moderato = "${TEMPO_TESTNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
